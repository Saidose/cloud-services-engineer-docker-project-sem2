services:
  backend:
    build: ./backend
    image: momo-backend:latest
    ports:
      - "8081:8081"
    networks:
      - app-network

  frontend:
    build: ./frontend
    image: momo-frontend:latest
    ports:
      - "80:8080"
    environment:
      VUE_APP_API_URL: "http://localhost:8081"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
