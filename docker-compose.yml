# Запуск: docker compose up -d --build
# Масштабирование: docker compose up -d --scale backend=3
# Разработка: docker compose -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: "1.0.0"
    image: momo-backend:latest
    expose:
      - "8081"
    networks:
      - backend-net
    volumes:
      - backend-data:/app/data
    secrets:
      - backend_secret
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_PATH: "/"
        VUE_APP_API_URL: ""
    image: momo-frontend:latest
    ports:
      - "80:8080"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  backend-data:

secrets:
  backend_secret:
    file: ./secrets/backend_secret.txt
